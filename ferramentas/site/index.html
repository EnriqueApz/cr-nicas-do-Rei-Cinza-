<title>Crônicas do Rei Cinza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: menu de capítulos à esquerda, coluna de leitura no meio, sumário das cenas à direita (telas largas). */
:root {
  --cinza-fundo: #eef0f2;      /* página: cinza frio, cor de cinza de lareira */
  --papel: #fbfbfa;            /* coluna de leitura */
  --tinta: #22262b;            /* texto */
  --tinta-suave: #5d6570;      /* rótulos, legendas */
  --linha: #d5d9de;            /* bordas */
  --alvorecer: #9a6a12;        /* destaque: ouro do Alvorecer */
  --alvorecer-fundo: #f7efdc;  /* caixa "Na sua mesa" */
  --sangue: #8a2a22;           /* títulos de missão */
  --ler-fundo: #f1f3f5;        /* texto para ler em voz alta */
  --fonte-titulo: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --fonte-texto: "Spectral", Georgia, "Times New Roman", serif;
  --fonte-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cinza-fundo: #15181c; --papel: #1c2025; --tinta: #e3e5e8; --tinta-suave: #9aa3ae; --linha: #333a42;
    --alvorecer: #e0b155; --alvorecer-fundo: #2a2416; --sangue: #e08a7c; --ler-fundo: #232830; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cinza-fundo: #15181c; --papel: #1c2025; --tinta: #e3e5e8; --tinta-suave: #9aa3ae; --linha: #333a42;
  --alvorecer: #e0b155; --alvorecer-fundo: #2a2416; --sangue: #e08a7c; --ler-fundo: #232830; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--cinza-fundo); color: var(--tinta); font: 17px/1.65 var(--fonte-texto); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--cinza-fundo); }

.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--cinza-fundo); border-bottom: 1px solid var(--linha); font-family: var(--fonte-ui);
}
.topo .marca { font: 700 19px/1.1 var(--fonte-titulo); letter-spacing: .02em; color: var(--tinta); white-space: nowrap; }
.topo .marca small { display: block; font: 500 12px var(--fonte-ui); color: var(--tinta-suave); letter-spacing: .08em; text-transform: uppercase; }
.topo .busca { margin-left: auto; position: relative; flex: 0 1 340px; min-width: 0; }
.topo input { width: 100%; padding: 8px 12px; border: 1px solid var(--linha); border-radius: 8px; background: var(--papel); color: var(--tinta); font: 15px var(--fonte-ui); }
button { font-family: var(--fonte-ui); }
.btn-menu { display: none; background: var(--papel); color: var(--tinta); border: 1px solid var(--linha); border-radius: 8px; padding: 7px 11px; font-size: 15px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--alvorecer); outline-offset: 2px; }

.resultados { position: absolute; right: 0; top: calc(100% + 6px); width: min(520px, 92vw); max-height: 70vh; overflow: auto; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; }
.resultados button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--tinta); padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.4; }
.resultados button:hover, .resultados button:focus-visible { background: var(--ler-fundo); }
.resultados b { color: var(--alvorecer); font-weight: 700; }
.resultados .onde { display: block; font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
.resultados .vazio { padding: 10px; color: var(--tinta-suave); font-size: 14px; }

.grade { display: grid; grid-template-columns: 260px minmax(0, 1fr) 220px; gap: 28px; max-width: 1320px; margin: 0 auto;
  padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.menu { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-family: var(--fonte-ui); padding-right: 4px; }
.menu h2 { font: 500 12px var(--fonte-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-suave); margin: 18px 0 6px; }
.menu h2:first-child { margin-top: 0; }
.menu a { display: flex; align-items: baseline; gap: 8px; padding: 5px 10px; border-radius: 6px; color: var(--tinta); text-decoration: none; font-size: 15px; line-height: 1.35; }
.menu a:hover { background: var(--papel); }
.menu a[aria-current="page"] { background: var(--papel); color: var(--alvorecer); font-weight: 700; box-shadow: inset 2px 0 0 var(--alvorecer); }
.menu .feita { margin-left: auto; color: var(--alvorecer); font-size: 13px; }

.leitura { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 28px clamp(18px, 4vw, 48px) 48px; min-width: 0; }
.leitura .cabeca { border-bottom: 1px solid var(--linha); padding-bottom: 14px; margin-bottom: 22px; }
.leitura .grupo { font: 500 13px var(--fonte-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-suave); margin: 0; }
.leitura h1 { font: 700 clamp(28px, 4vw, 38px)/1.15 var(--fonte-titulo); color: var(--sangue); margin: 4px 0 0; text-wrap: balance; }
.feito-linha { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 14px var(--fonte-ui); color: var(--tinta-suave); }
.conteudo { max-width: 68ch; }
.conteudo h2 { font: 700 25px/1.25 var(--fonte-titulo); color: var(--tinta); margin: 38px 0 10px; text-wrap: balance; scroll-margin-top: 90px; }
.conteudo h3 { font: 700 20px/1.3 var(--fonte-titulo); color: var(--sangue); margin: 28px 0 8px; text-wrap: balance; scroll-margin-top: 90px; }
.conteudo h4 { font: 700 15px var(--fonte-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--sangue); margin: 22px 0 6px; scroll-margin-top: 90px; }
.conteudo p { margin: 0 0 12px; }
.conteudo ul, .conteudo ol { padding-left: 1.3em; margin: 0 0 14px; }
.conteudo li { margin-bottom: 6px; }
.conteudo strong { font-weight: 600; }
.conteudo a { color: var(--alvorecer); }
.conteudo code { font-size: .9em; background: var(--ler-fundo); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.conteudo blockquote { margin: 16px 0; }
.conteudo blockquote:not(.ler) { border-left: 3px solid var(--linha); padding-left: 14px; color: var(--tinta-suave); font-style: italic; }
.conteudo hr { border: 0; border-top: 1px solid var(--linha); margin: 28px 0; }
.item { padding-left: 4px; }

.ler { background: var(--ler-fundo); border-radius: 10px; padding: 14px 18px 4px; font-style: italic; }
.ler .selo, .selo-mestre, .mesa-selo { font: 700 11px var(--fonte-ui); font-style: normal; text-transform: uppercase; letter-spacing: .14em; color: var(--tinta-suave); margin-bottom: 6px; }
.selo-mestre { margin: 22px 0 -4px; color: var(--sangue); }

.mesa { background: var(--alvorecer-fundo); border: 1px solid color-mix(in srgb, var(--alvorecer) 45%, transparent); border-radius: 12px; padding: 16px 20px 6px; margin: 0 0 30px; }
.mesa-selo { color: var(--alvorecer); }
.mesa h3 { font: 700 18px var(--fonte-titulo); color: var(--tinta); margin: 12px 0 6px; }

.tabela { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--linha); border-radius: 8px; }
.tabela table { border-collapse: collapse; width: 100%; font: 14.5px/1.45 var(--fonte-ui); }
.tabela th { text-align: left; background: var(--ler-fundo); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
.tabela td { padding: 8px 10px; border-top: 1px solid var(--linha); vertical-align: top; font-variant-numeric: tabular-nums; }
.tabela tr:first-child td { border-top: 0; }

details.prompt { margin: 12px 0; border: 1px dashed var(--linha); border-radius: 8px; padding: 8px 12px; font-family: var(--fonte-ui); }
details.prompt summary { cursor: pointer; color: var(--tinta-suave); font-size: 14px; }
details.prompt pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; margin: 8px 0 4px; }

.lado { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-family: var(--fonte-ui); }
.lado h2 { font: 500 12px var(--fonte-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-suave); margin: 0 0 6px; }
.lado a { display: block; padding: 4px 8px; color: var(--tinta-suave); text-decoration: none; font-size: 14px; line-height: 1.35; border-left: 2px solid var(--linha); }
.lado a:hover { color: var(--tinta); border-left-color: var(--alvorecer); }

.abre { font-size: 19px; }
.nota { color: var(--tinta-suave); font: 14px var(--fonte-ui); }
.ouvir { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 18px; }
.ouvir button { background: var(--alvorecer); color: var(--papel); border: 0; border-radius: 8px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
.ouvir button.secundario { background: transparent; color: var(--tinta); border: 1px solid var(--linha); font-weight: 500; }
.falado.lendo { background: var(--alvorecer-fundo); border-radius: 6px; }
.carregando { color: var(--tinta-suave); font: 15px var(--fonte-ui); }

@media (max-width: 1180px) { .grade { grid-template-columns: 240px minmax(0, 1fr); } .lado { display: none; } }
@media (max-width: 820px) {
  .grade { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .btn-menu { display: inline-block; }
  .menu { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); max-height: none; z-index: 40; background: var(--cinza-fundo); border-right: 1px solid var(--linha);
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px) max(14px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; }
  body.menu-aberto .menu { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  .topo { flex-wrap: wrap; row-gap: 8px; }
  .topo .busca { flex: 1 1 100%; order: 3; margin-left: 0; }
  .btn-menu { white-space: nowrap; }
  .resultados { width: 100%; }
  .leitura { padding: 20px 16px 36px; border-radius: 10px; }
}
@media (prefers-reduced-motion: reduce) { .menu { transition: none; } }
</style>

<header class="topo">
  <button type="button" class="btn-menu" id="btn-menu" aria-expanded="false" aria-controls="menu">☰ Capítulos</button>
  <div class="marca">Crônicas do Rei Cinza<small>Material do mestre</small></div>
  <div class="busca">
    <input id="busca" type="search" placeholder="Buscar (Tobias, Edda, Relicário...)" autocomplete="off" aria-label="Buscar em todas as páginas">
    <div class="resultados" id="resultados" hidden></div>
  </div>
</header>

<div class="grade">
  <nav class="menu" id="menu" aria-label="Capítulos"></nav>
  <main class="leitura" id="leitura"><p class="carregando">Carregando a bíblia...</p></main>
  <aside class="lado" id="lado" aria-label="Nesta página"></aside>
</div>

<script>
(function () {
  let paginas = [];
  const menu = document.getElementById('menu');
  const leitura = document.getElementById('leitura');
  const lado = document.getElementById('lado');
  const busca = document.getElementById('busca');
  const resultados = document.getElementById('resultados');

  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* sem armazenamento */ } };
  const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (_) { return padrao; } };
  let feitas = ler('cronicas-feitas', {});

  function montarMenu(atual) {
    let h = '', grupo = '';
    for (const p of paginas) {
      if (p.grupo !== grupo) { grupo = p.grupo; h += `<h2>${grupo}</h2>`; }
      const marca = p.num && feitas[p.id] ? '<span class="feita" title="Missão jogada">✓</span>' : '';
      h += `<a href="#${p.id}"${p.id === atual ? ' aria-current="page"' : ''}>${p.curto}${marca}</a>`;
    }
    menu.innerHTML = h;
  }

  function mostrar(id, alvo) {
    const p = paginas.find((x) => x.id === id) || paginas[0];
    montarMenu(p.id);
    const feito = p.num ? `<label class="feito-linha"><input type="checkbox" id="feita-${p.id}"${feitas[p.id] ? ' checked' : ''}> Já jogamos esta missão</label>` : '';
    leitura.innerHTML = `<div class="cabeca"><p class="grupo">${p.grupo}</p><h1>${p.titulo}</h1>${feito}</div><div class="conteudo">${p.html}</div>`;
    const caixa = document.getElementById(`feita-${p.id}`);
    if (caixa) caixa.addEventListener('change', () => { feitas[p.id] = caixa.checked; guardar('cronicas-feitas', feitas); montarMenu(p.id); });
    const titulos = [...leitura.querySelectorAll('.conteudo h2[id]')];
    lado.innerHTML = titulos.length > 1 ? '<h2>Nesta página</h2>' + titulos.map((t) => `<a href="#${p.id}" data-ir="${t.id}">${t.textContent}</a>`).join('') : '';
    if (p.id === 'resumo') prepararOuvir();
    document.body.classList.remove('menu-aberto');
    document.getElementById('btn-menu').setAttribute('aria-expanded', 'false');
    if (alvo) {
      const el = leitura.querySelector(alvo);
      if (el) { el.scrollIntoView({ block: 'center' }); el.style.transition = 'background .6s'; el.style.background = 'var(--alvorecer-fundo)'; setTimeout(() => { el.style.background = ''; }, 1600); return; }
    }
    window.scrollTo(0, 0);
  }

  lado.addEventListener('click', (ev) => {
    const a = ev.target.closest('a[data-ir]');
    if (!a) return;
    ev.preventDefault();
    const el = document.getElementById(a.dataset.ir);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('btn-menu').addEventListener('click', () => {
    const aberto = document.body.classList.toggle('menu-aberto');
    document.getElementById('btn-menu').setAttribute('aria-expanded', String(aberto));
  });
  menu.addEventListener('click', (ev) => {
    const a = ev.target.closest('a');
    if (a && a.getAttribute('href') === location.hash) mostrar(location.hash.slice(1));
  });

  // ---------- busca ----------
  let indice = [];
  function montarIndice() {
    const tmp = document.createElement('div');
    indice = [];
    for (const p of paginas) {
      tmp.innerHTML = p.html;
      tmp.querySelectorAll('h2, h3, h4, p, li, td, blockquote p').forEach((el, i) => {
        if (el.closest('li') && el.tagName !== 'LI') return;
        const t = el.textContent.replace(/\s+/g, ' ').trim();
        if (t) indice.push({ pagina: p, texto: t, tag: el.tagName, ordem: i });
      });
    }
  }
  const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let achados = [];
  busca.addEventListener('input', () => {
    const q = semAcento(busca.value.trim());
    if (q.length < 3) { resultados.hidden = true; return; }
    achados = indice.filter((x) => semAcento(x.texto).includes(q)).slice(0, 40);
    if (!achados.length) { resultados.innerHTML = '<div class="vazio">Nada encontrado.</div>'; resultados.hidden = false; return; }
    resultados.innerHTML = achados.map((x, i) => {
      const n = semAcento(x.texto).indexOf(q);
      const ini = Math.max(0, n - 50);
      const trecho = (ini ? '…' : '') + esc(x.texto.slice(ini, n)) + '<b>' + esc(x.texto.slice(n, n + q.length)) + '</b>' + esc(x.texto.slice(n + q.length, n + q.length + 80)) + '…';
      return `<button type="button" data-i="${i}"><span class="onde">${esc(x.pagina.curto)}</span>${trecho}</button>`;
    }).join('');
    resultados.hidden = false;
  });
  resultados.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-i]');
    if (!b) return;
    const x = achados[Number(b.dataset.i)];
    resultados.hidden = true;
    busca.value = '';
    if (location.hash !== '#' + x.pagina.id) history.replaceState(null, '', '#' + x.pagina.id);
    mostrar(x.pagina.id);
    const el = [...leitura.querySelectorAll('.conteudo ' + x.tag.toLowerCase())].find((e) => e.textContent.replace(/\s+/g, ' ').trim() === x.texto);
    if (el) { el.scrollIntoView({ block: 'center' }); el.style.transition = 'background .6s'; el.style.background = 'var(--alvorecer-fundo)'; setTimeout(() => { el.style.background = ''; }, 1800); }
  });
  document.addEventListener('click', (ev) => { if (!ev.target.closest('.busca')) resultados.hidden = true; });
  busca.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { resultados.hidden = true; busca.blur(); } });

  // ---------- ouvir o resumo ----------
  function prepararOuvir() {
    const fala = window.speechSynthesis;
    const info = document.getElementById('voz-info');
    const pars = [...leitura.querySelectorAll('.falado')];
    if (!fala) { info.textContent = 'Este navegador não lê em voz alta.'; return; }
    let ativo = false, atual = 0;
    const voz = () => fala.getVoices().filter((v) => /^pt/i.test(v.lang)).sort((a, b) => nota(b) - nota(a))[0];
    function nota(v) { const n = v.name.toLowerCase(); return (/pt-br/i.test(v.lang) ? 100 : 0) + (/natural|online|neural/.test(n) ? 30 : 0) + (/google/.test(n) ? 20 : 0); }
    function marcar(i) { pars.forEach((p, k) => p.classList.toggle('lendo', k === i)); if (pars[i]) pars[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    function seguinte() {
      if (!ativo || atual >= pars.length) { ativo = false; marcar(-1); return; }
      marcar(atual);
      const frases = pars[atual].textContent.match(/[^.!?:]+[.!?:]*/g) || [pars[atual].textContent];
      let k = 0;
      const dizer = () => {
        if (!ativo) return;
        if (k >= frases.length) { atual += 1; setTimeout(seguinte, 300); return; }
        const u = new SpeechSynthesisUtterance(frases[k++].trim());
        const v = voz();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'pt-BR';
        u.onend = dizer; u.onerror = dizer;
        fala.speak(u);
      };
      dizer();
    }
    document.getElementById('ouvir-resumo').onclick = () => { fala.cancel(); ativo = true; atual = 0; const v = voz(); info.textContent = v ? `Voz: ${v.name}` : 'Sem voz em português: o navegador usa a padrão.'; seguinte(); };
    document.getElementById('parar-resumo').onclick = () => { ativo = false; fala.cancel(); marcar(-1); };
    pars.forEach((p, i) => { p.style.cursor = 'pointer'; p.onclick = () => { fala.cancel(); ativo = true; atual = i; seguinte(); }; });
  }

  // ---------- rotas ----------
  const rota = () => mostrar(location.hash.slice(1) || 'inicio');
  window.addEventListener('hashchange', rota);

  fetch('dados/cronicas.json')
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((dados) => { paginas = dados; montarIndice(); rota(); })
    .catch(() => { leitura.innerHTML = '<p>Não consegui carregar o conteúdo. Recarregue a página.</p>'; });
})();
</script>
