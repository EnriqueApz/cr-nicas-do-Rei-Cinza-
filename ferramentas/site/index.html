<title>Crônicas do Rei Cinza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: menu de capítulos à esquerda, coluna de leitura no meio, sumário das cenas à direita. Cada ato tem a sua cor. */
:root {
  --fundo: #eceef3;            /* cinza frio, cor de cinza */
  --papel: #ffffff;
  --papel-2: #f5f6f9;
  --tinta: #1d2128;
  --tinta-suave: #5b6472;
  --linha: #dcdfe6;
  --ouro: #b07600;             /* o Alvorecer */
  --ouro-forte: #f2b13a;
  --ouro-fundo: #fff4dc;
  --ato: #2f9a6a;              /* troca por ato */
  --ato-fundo: #e3f4ec;
  --ler: #2f5fae;              /* ler em voz alta */
  --ler-fundo: #eaf1fd;
  --mestre: #a33a2c;           /* para o mestre */
  --mestre-fundo: #fcebe8;
  --fala: #7a3fb0;             /* falas dos personagens */
  --fala-fundo: #f3eafc;
  --sombra: 0 1px 2px rgba(20, 24, 33, .06), 0 8px 24px rgba(20, 24, 33, .07);
  --fonte-titulo: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --fonte-texto: "Spectral", Georgia, "Times New Roman", serif;
  --fonte-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0f1217; --papel: #171b22; --papel-2: #1e232c; --tinta: #e6e8ec; --tinta-suave: #9aa3b1; --linha: #2b313c;
    --ouro: #f2b13a; --ouro-forte: #ffc85c; --ouro-fundo: #2a2214; --ato-fundo: #13261e;
    --ler: #8db4ff; --ler-fundo: #16223a; --mestre: #ff9784; --mestre-fundo: #2e1915; --fala: #d4adff; --fala-fundo: #2a1c3a;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #0f1217; --papel: #171b22; --papel-2: #1e232c; --tinta: #e6e8ec; --tinta-suave: #9aa3b1; --linha: #2b313c;
  --ouro: #f2b13a; --ouro-forte: #ffc85c; --ouro-fundo: #2a2214; --ato-fundo: #13261e;
  --ler: #8db4ff; --ler-fundo: #16223a; --mestre: #ff9784; --mestre-fundo: #2e1915; --fala: #d4adff; --fala-fundo: #2a1c3a;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
}
body[data-ato="1"] { --ato: #2f9a6a; }
body[data-ato="2"] { --ato: #3f78d8; }
body[data-ato="3"] { --ato: #9a55d6; }
body[data-ato="0"] { --ato: var(--ouro); }
* { box-sizing: border-box; }
body { background: var(--fundo); color: var(--tinta); font: 17px/1.7 var(--fonte-texto); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fundo); }
button { font-family: var(--fonte-ui); }
:focus-visible { outline: 3px solid var(--ouro-forte); outline-offset: 2px; border-radius: 6px; }

/* ---------- topo ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); font-family: var(--fonte-ui);
}
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); }
.marca .sol { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 50% 60%, var(--ouro-forte), var(--ouro) 70%); color: #2a1a00; font: 800 18px var(--fonte-titulo); box-shadow: 0 0 0 4px var(--ouro-fundo); }
.marca b { font: 800 19px/1 var(--fonte-titulo); letter-spacing: .01em; white-space: nowrap; }
.marca small { display: block; font: 600 11px var(--fonte-ui); color: var(--tinta-suave); letter-spacing: .14em; text-transform: uppercase; margin-top: 3px; }
.busca { margin-left: auto; position: relative; flex: 0 1 360px; min-width: 0; }
.busca input { width: 100%; padding: 9px 14px 9px 36px; border: 1px solid var(--linha); border-radius: 999px; background: var(--papel); color: var(--tinta); font: 15px var(--fonte-ui); }
.busca::before { content: "⌕"; position: absolute; left: 13px; top: 50%; transform: translateY(-52%); color: var(--tinta-suave); font-size: 18px; pointer-events: none; }
.btn-menu { display: none; background: var(--papel); color: var(--tinta); border: 1px solid var(--linha); border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.progresso { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: linear-gradient(90deg, var(--ato), var(--ouro-forte)); border-radius: 0 3px 3px 0; transition: width .1s linear; }

.resultados { position: absolute; right: 0; top: calc(100% + 8px); width: min(540px, 92vw); max-height: 70vh; overflow: auto; background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; box-shadow: var(--sombra); padding: 6px; }
.resultados button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--tinta); padding: 9px 11px; border-radius: 9px; cursor: pointer; font-size: 14px; line-height: 1.45; }
.resultados button:hover, .resultados button:focus-visible { background: var(--papel-2); }
.resultados b { background: var(--ouro-fundo); color: var(--ouro); border-radius: 3px; padding: 0 2px; }
.resultados .onde { display: block; font-size: 11px; font-weight: 700; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .08em; }
.resultados .vazio { padding: 12px; color: var(--tinta-suave); font-size: 14px; }

/* ---------- grade ---------- */
.grade { display: grid; grid-template-columns: 250px minmax(0, 1fr) 230px; gap: 26px; max-width: 1340px; margin: 0 auto;
  padding-block: 22px 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.menu { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-family: var(--fonte-ui); padding: 2px 4px 10px 2px; }
.menu h2 { font: 800 11px var(--fonte-ui); text-transform: uppercase; letter-spacing: .14em; color: var(--tinta-suave); margin: 18px 0 6px 10px; display: flex; align-items: center; gap: 7px; }
.menu h2:first-child { margin-top: 2px; }
.menu h2 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.menu a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 10px; color: var(--tinta); text-decoration: none; font-size: 15px; line-height: 1.3; }
.menu a:hover { background: var(--papel); }
.menu a .n { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 800 12px var(--fonte-ui); background: var(--papel-2); color: var(--tinta-suave); }
.menu a .t { flex: 1; min-width: 0; }
.menu a[aria-current="page"] { background: var(--papel); box-shadow: var(--sombra); font-weight: 700; }
.menu a[aria-current="page"] .n { background: var(--cor, var(--ouro)); color: #fff; }
.menu a.feita .n { background: color-mix(in srgb, var(--cor, var(--ouro)) 22%, transparent); color: var(--cor, var(--ouro)); }
.menu a.feita .n::after { content: "✓"; }
.menu a.feita .n span { display: none; }
.menu .mini { flex: none; width: 34px; height: 5px; border-radius: 3px; background: var(--papel-2); overflow: hidden; }
.menu .mini i { display: block; height: 100%; background: var(--cor, var(--ouro)); }

/* ---------- leitura ---------- */
.leitura { min-width: 0; }
.capa { position: relative; overflow: hidden; border-radius: 18px; padding: 26px clamp(18px, 4vw, 40px) 22px; margin-bottom: 18px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--ouro-forte) 55%, transparent) 0%, transparent 45%), linear-gradient(135deg, var(--ato), color-mix(in srgb, var(--ato) 55%, #0b0d12)); box-shadow: var(--sombra); }
.capa .numero { position: absolute; right: clamp(10px, 3vw, 30px); top: -18px; font: 800 clamp(110px, 16vw, 170px)/1 var(--fonte-titulo); color: rgba(255, 255, 255, .13); pointer-events: none; }
.capa .grupo { font: 800 12px var(--fonte-ui); text-transform: uppercase; letter-spacing: .16em; opacity: .85; margin: 0; }
.capa h1 { position: relative; font: 800 clamp(28px, 4.2vw, 42px)/1.1 var(--fonte-titulo); margin: 6px 0 12px; text-wrap: balance; max-width: 22ch; }
.chips { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 13px var(--fonte-ui); padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, .17); color: #fff; border: 1px solid rgba(255, 255, 255, .25); }
.barra-missao { position: relative; margin-top: 16px; display: flex; align-items: center; gap: 12px; font: 700 13px var(--fonte-ui); }
.barra-missao .trilho { flex: 1; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.barra-missao .trilho i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #fff, var(--ouro-forte)); transition: width .5s cubic-bezier(.2, .9, .3, 1.2); }

.pulos { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin-bottom: 10px; scrollbar-width: thin; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 5; background: linear-gradient(var(--fundo) 80%, transparent); padding-top: 10px; }
.pulos button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); border-radius: 999px; padding: 6px 12px; font: 700 13px var(--fonte-ui); cursor: pointer; white-space: nowrap; transition: transform .12s, background .2s; }
.pulos button:hover { transform: translateY(-1px); }
.pulos button.aqui { background: var(--ato); border-color: var(--ato); color: #fff; }
.pulos button.ok { border-color: color-mix(in srgb, var(--ato) 60%, transparent); }
.pulos button.ok::before { content: "✓"; color: var(--ato); font-weight: 800; }
.pulos button.aqui.ok::before { color: #fff; }

.folha { background: var(--papel); border: 1px solid var(--linha); border-radius: 18px; padding: 26px clamp(18px, 4vw, 44px) 40px; box-shadow: var(--sombra); }
.conteudo { max-width: 70ch; }
.conteudo > p:first-child, .conteudo .abre { font-size: 19px; }
.conteudo h2 { font: 800 26px/1.2 var(--fonte-titulo); color: var(--tinta); margin: 0 0 12px; text-wrap: balance; scroll-margin-top: 130px; }
.conteudo h3 { font: 700 20px/1.3 var(--fonte-titulo); color: var(--ato); margin: 26px 0 8px; text-wrap: balance; scroll-margin-top: 130px; }
.conteudo h4 { font: 800 13px var(--fonte-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--mestre); margin: 22px 0 6px; scroll-margin-top: 130px; }
.conteudo p { margin: 0 0 13px; }
.conteudo ul, .conteudo ol { padding-left: 1.3em; margin: 0 0 14px; }
.conteudo li { margin-bottom: 7px; }
.conteudo li::marker { color: var(--ato); }
.conteudo strong { font-weight: 600; }
.conteudo a { color: var(--ouro); }
.conteudo code { font-size: .88em; background: var(--papel-2); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.conteudo hr { border: 0; border-top: 1px solid var(--linha); margin: 28px 0; }
.conteudo blockquote:not(.ler) { margin: 16px 0; border-left: 3px solid var(--ato); padding-left: 14px; color: var(--tinta-suave); font-style: italic; }
.item { font-family: var(--fonte-ui); padding: 6px 12px; border-radius: 9px; background: var(--papel-2); }

/* cenas */
.cena { border-top: 1px dashed var(--linha); padding-top: 26px; margin-top: 30px; scroll-margin-top: 130px; }
.cena-topo { display: flex; align-items: flex-start; gap: 12px; }
.cena-topo h2 { flex: 1; }
.check { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--linha); background: var(--papel); color: var(--tinta-suave); border-radius: 999px; padding: 5px 12px 5px 8px; font: 800 13px var(--fonte-ui); cursor: pointer; margin-top: 2px; transition: all .2s; }
.check .bola { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 12px; line-height: 1; }
.check:hover { border-color: var(--ato); color: var(--ato); }
.check[aria-pressed="true"] { background: var(--ato); border-color: var(--ato); color: #fff; }
.check[aria-pressed="true"] .bola { background: #fff; color: var(--ato); border-color: #fff; }
.check[aria-pressed="true"] .bola::after { content: "✓"; font-weight: 800; }
.check.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.cena.feita > :not(.cena-topo):not(.seguir) { opacity: .55; }
.seguir { display: flex; justify-content: flex-end; margin-top: 16px; }
.seguir button { border: 0; background: var(--papel-2); color: var(--tinta); border-radius: 999px; padding: 8px 16px; font: 800 14px var(--fonte-ui); cursor: pointer; }
.seguir button:hover { background: var(--ato); color: #fff; }

/* blocos */
.ler { position: relative; margin: 16px 0; background: var(--ler-fundo); border-radius: 14px; padding: 16px 18px 6px 50px; font-size: 18px; }
.ler::before { content: "“"; position: absolute; left: 14px; top: 2px; font: 800 52px/1 var(--fonte-titulo); color: var(--ler); opacity: .7; }
.ler .selo { font: 800 11px var(--fonte-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ler); margin-bottom: 6px; }
.ler p { font-style: italic; }
.selo-mestre { display: inline-flex; align-items: center; gap: 6px; margin: 20px 0 2px; font: 800 11px var(--fonte-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mestre); background: var(--mestre-fundo); padding: 4px 10px; border-radius: 999px; }
.selo-mestre::before { content: "◆"; font-size: 9px; }

.mesa { position: relative; background: var(--ouro-fundo); border: 2px solid color-mix(in srgb, var(--ouro-forte) 70%, transparent); border-radius: 16px; padding: 18px 20px 8px; margin: 0 0 8px; }
.mesa-selo { display: inline-flex; align-items: center; gap: 8px; font: 800 12px var(--fonte-ui); letter-spacing: .12em; text-transform: uppercase; color: #2a1a00; background: var(--ouro-forte); padding: 5px 12px; border-radius: 999px; }
.mesa-selo::before { content: "★"; }
.mesa h3 { font: 800 18px var(--fonte-titulo); color: var(--tinta); margin: 14px 0 6px; }
.mesa li::marker { color: var(--ouro); }

.tabela { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--linha); border-radius: 12px; }
.tabela table { border-collapse: collapse; width: 100%; font: 15px/1.45 var(--fonte-ui); }
.tabela th { text-align: left; background: var(--papel-2); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-suave); padding: 9px 12px; white-space: nowrap; }
.tabela td { padding: 9px 12px; border-top: 1px solid var(--linha); vertical-align: top; font-variant-numeric: tabular-nums; }
.tabela tbody tr:hover td { background: color-mix(in srgb, var(--ato) 7%, transparent); }

details.prompt { margin: 12px 0; border: 1px dashed var(--linha); border-radius: 12px; padding: 9px 14px; font-family: var(--fonte-ui); }
details.prompt summary { cursor: pointer; color: var(--tinta-suave); font-size: 14px; font-weight: 700; }
details.prompt pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; margin: 8px 0 4px; }

/* início */
.missoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 26px; }
.cartao { position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 14px; padding: 14px 14px 12px; min-height: 118px; cursor: pointer; color: #fff; display: flex; flex-direction: column; gap: 4px;
  background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 50%, #0b0d12)); box-shadow: var(--sombra); transition: transform .15s, box-shadow .15s; font-family: var(--fonte-ui); }
.cartao:hover { transform: translateY(-3px) rotate(-.4deg); }
.cartao .num { position: absolute; right: 8px; top: -8px; font: 800 64px/1 var(--fonte-titulo); color: rgba(255, 255, 255, .16); }
.cartao .ato { font: 800 10px var(--fonte-ui); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.cartao .nome { font: 800 18px/1.15 var(--fonte-titulo); max-width: 85%; }
.cartao .nivel { margin-top: auto; font: 700 12px var(--fonte-ui); opacity: .9; display: flex; justify-content: space-between; align-items: center; }
.cartao.prox { outline: 3px solid var(--ouro-forte); outline-offset: 2px; }
.prox-selo { font: 800 10px var(--fonte-ui); letter-spacing: .12em; background: var(--ouro-forte); color: #2a1a00; padding: 2px 8px; border-radius: 999px; }
.cartao.jogada { filter: saturate(.55); }
.cartao.jogada .nivel::after { content: "✓ jogada"; }

.lado { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-family: var(--fonte-ui); }
.lado h2 { font: 800 11px var(--fonte-ui); text-transform: uppercase; letter-spacing: .14em; color: var(--tinta-suave); margin: 4px 0 8px 10px; }
.lado a { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; color: var(--tinta-suave); text-decoration: none; font-size: 14px; line-height: 1.35; border-radius: 8px; }
.lado a:hover { background: var(--papel); color: var(--tinta); }
.lado a.aqui { background: var(--papel); color: var(--tinta); font-weight: 700; box-shadow: inset 3px 0 0 var(--ato); }
.lado a.ok::before { content: "✓"; color: var(--ato); font-weight: 800; }

.nota { color: var(--tinta-suave); font: 14px var(--fonte-ui); }
.ouvir { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 18px; }
.ouvir button { background: var(--ouro-forte); color: #2a1a00; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 800; cursor: pointer; }
.ouvir button.secundario { background: transparent; color: var(--tinta); border: 1px solid var(--linha); font-weight: 700; }
.falado { padding: 4px 8px; border-radius: 8px; transition: background .3s; }
.falado.lendo { background: var(--ouro-fundo); }
.carregando { color: var(--tinta-suave); font: 15px var(--fonte-ui); }

/* falas e legenda */
q.fala { quotes: none; font-style: italic; color: var(--fala); background: var(--fala-fundo); border-radius: 7px; padding: 1px 6px 1px 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
q.fala::before { content: "🗨 "; font-style: normal; font-size: .85em; }
.tabela td em.fala { color: var(--fala); }
.ler q.fala { background: transparent; padding: 0; }
.ler q.fala::before { content: "“"; font-size: 1em; }
.ler q.fala::after { content: "”"; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 18px; font: 700 13px var(--fonte-ui); color: var(--tinta-suave); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.btn-narrar { margin-left: auto; border: 2px solid var(--fala); background: var(--papel); color: var(--fala); border-radius: 999px; padding: 6px 14px; font: 800 13px var(--fonte-ui); cursor: pointer; }
.btn-narrar[aria-pressed="true"] { background: var(--fala); color: var(--papel); }
body.narrar .conteudo :is(p, li, .tabela, h3, h4, .selo-mestre, details, .item):not(:has(.fala)):not(.ler *):not(.mesa-selo) { opacity: .22; }
body.narrar .conteudo .mesa :is(h3) { opacity: .22; }
body.narrar .conteudo .ler { box-shadow: 0 0 0 3px var(--ler); }
body.narrar .cena.feita > :not(.cena-topo):not(.seguir) { opacity: 1; }

/* festa */
.festa { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.festa i { position: absolute; top: 40%; left: 50%; width: 10px; height: 14px; border-radius: 2px; animation: voa 1.3s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes voa { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
.aviso-festa { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 51; background: var(--tinta); color: var(--papel); font: 800 15px var(--fonte-ui); padding: 12px 20px; border-radius: 999px; box-shadow: var(--sombra); animation: sobe .35s ease-out; }
@keyframes sobe { from { transform: translate(-50%, 20px); opacity: 0; } }

@media (max-width: 1180px) { .grade { grid-template-columns: 236px minmax(0, 1fr); } .lado { display: none; } }
@media (max-width: 820px) {
  .grade { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 14px; }
  .btn-menu { display: inline-block; }
  .topo { flex-wrap: wrap; row-gap: 8px; }
  .busca { flex: 1 1 100%; order: 3; margin-left: 0; }
  .resultados { width: 100%; }
  .marca small { display: none; }
  .marca b { font-size: 16px; }
  .marca .sol { width: 28px; height: 28px; font-size: 15px; }
  .topo { gap: 10px; }
  .menu { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); max-height: none; z-index: 40; background: var(--fundo); border-right: 1px solid var(--linha);
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px) max(12px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .22s ease; }
  body.menu-aberto .menu { transform: none; box-shadow: 0 0 50px rgba(0, 0, 0, .4); }
  .pulos { top: calc(env(safe-area-inset-top, 0px) + 100px); }
  .folha { padding: 20px 16px 30px; border-radius: 14px; }
  .cena-topo { flex-direction: column; gap: 6px; }
  .check { align-self: flex-start; }
  .ler { padding-left: 40px; font-size: 17px; }
  .ler::before { left: 10px; font-size: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="topo" id="topo">
  <button type="button" class="btn-menu" id="btn-menu" aria-expanded="false" aria-controls="menu" aria-label="Abrir capítulos">☰</button>
  <a class="marca" href="#inicio"><span class="sol">R</span><span><b>Crônicas do Rei Cinza</b><small>Material do mestre</small></span></a>
  <div class="busca">
    <input id="busca" type="search" placeholder="Buscar: Tobias, Edda, Relicário..." autocomplete="off" aria-label="Buscar em todas as páginas">
    <div class="resultados" id="resultados" hidden></div>
  </div>
  <div class="progresso" id="progresso"></div>
</header>

<div class="grade">
  <nav class="menu" id="menu" aria-label="Capítulos"></nav>
  <main class="leitura" id="leitura"><p class="carregando">Abrindo a bíblia...</p></main>
  <aside class="lado" id="lado" aria-label="Nesta página"></aside>
</div>

<script>
(function () {
  let paginas = [];
  const $ = (id) => document.getElementById(id);
  const menu = $('menu'), leitura = $('leitura'), lado = $('lado'), busca = $('busca'), resultados = $('resultados');
  const CORES = { 0: 'var(--ouro)', 1: '#2f9a6a', 2: '#3f78d8', 3: '#9a55d6' };
  const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* sem armazenamento */ } };
  const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (_) { return padrao; } };
  let feitas = ler('cronicas-feitas', {});
  let cenas = ler('cronicas-cenas', {});

  const atoDe = (p) => (p.num ? (p.num <= 4 ? 1 : p.num <= 8 ? 2 : 3) : 0);
  const nivelDe = (p) => (p.num ? String(p.num + 2) : '');
  const contarCenas = (p) => (p.html.match(/<h2[ >]/g) || []).length;
  const feitasDe = (p) => Object.values(cenas[p.id] || {}).filter(Boolean).length;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function montarMenu(atual) {
    let h = '', grupo = '';
    for (const p of paginas) {
      const cor = CORES[atoDe(p)];
      if (p.grupo !== grupo) { grupo = p.grupo; h += `<h2>${p.num ? `<i style="background:${cor}"></i>` : ''}${grupo}</h2>`; }
      const total = p.num ? contarCenas(p) : 0;
      const pct = total ? Math.round((feitasDe(p) / total) * 100) : 0;
      const nome = p.num ? p.curto.replace(/^\d+\.\s*/, '') : p.curto;
      const n = p.num ? `<span class="n"><span>${p.num}</span></span>` : '';
      const mini = p.num && pct > 0 && !feitas[p.id] ? `<span class="mini"><i style="width:${pct}%"></i></span>` : '';
      h += `<a href="#${p.id}" style="--cor:${cor}"${p.id === atual ? ' aria-current="page"' : ''}${p.num && feitas[p.id] ? ' class="feita"' : ''}>${n}<span class="t">${nome}</span>${mini}</a>`;
    }
    menu.innerHTML = h;
  }

  // Divide a missão em cenas (cada título grande vira uma cena com o seu ✓).
  function emCenas(conteudo, p) {
    const secoes = [];
    let atual = null;
    [...conteudo.childNodes].forEach((no) => {
      if (no.nodeType === 1 && no.tagName === 'H2') {
        atual = document.createElement('section');
        atual.className = 'cena';
        atual.id = 'cena-' + (no.id || secoes.length);
        const topo = document.createElement('div');
        topo.className = 'cena-topo';
        no.removeAttribute('id');
        topo.appendChild(no);
        atual.appendChild(topo);
        conteudo.insertBefore(atual, no.nextSibling);
        secoes.push(atual);
        return;
      }
      if (atual) atual.appendChild(no);
    });
    secoes.forEach((s, i) => {
      const id = s.id;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'check';
      b.innerHTML = '<span class="bola"></span> Feita';
      b.setAttribute('aria-pressed', String(!!(cenas[p.id] || {})[id]));
      s.classList.toggle('feita', b.getAttribute('aria-pressed') === 'true');
      b.addEventListener('click', () => marcarCena(p, s, b));
      s.querySelector('.cena-topo').appendChild(b);
      if (i < secoes.length - 1) {
        const seg = document.createElement('div');
        seg.className = 'seguir';
        seg.innerHTML = `<button type="button">Próxima: ${esc(secoes[i + 1].querySelector('h2').textContent)} →</button>`;
        seg.querySelector('button').addEventListener('click', () => secoes[i + 1].scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' }));
        s.appendChild(seg);
      }
    });
    return secoes;
  }

  function marcarCena(p, s, b) {
    const ligado = b.getAttribute('aria-pressed') !== 'true';
    cenas[p.id] = cenas[p.id] || {};
    cenas[p.id][s.id] = ligado;
    guardar('cronicas-cenas', cenas);
    b.setAttribute('aria-pressed', String(ligado));
    s.classList.toggle('feita', ligado);
    b.classList.remove('pop'); void b.offsetWidth; if (ligado) b.classList.add('pop');
    atualizarProgresso(p);
    const total = contarCenas(p);
    if (ligado && feitasDe(p) === total && total > 0) {
      feitas[p.id] = true; guardar('cronicas-feitas', feitas);
      const caixa = $('feita-' + p.id); if (caixa) caixa.checked = true;
      festejar(`Missão ${p.num} completa! ★`);
    } else if (ligado) {
      festejar(null);
    }
    montarMenu(p.id);
  }

  function atualizarProgresso(p) {
    const total = contarCenas(p);
    const f = feitasDe(p);
    const barra = leitura.querySelector('.barra-missao i');
    const txt = leitura.querySelector('.barra-missao span');
    if (barra) barra.style.width = (total ? (f / total) * 100 : 0) + '%';
    if (txt) txt.textContent = `${f} de ${total} cenas`;
    leitura.querySelectorAll('.pulos button').forEach((b) => b.classList.toggle('ok', !!(cenas[p.id] || {})[b.dataset.ir]));
    lado.querySelectorAll('a[data-ir]').forEach((a) => a.classList.toggle('ok', !!(cenas[p.id] || {})[a.dataset.ir]));
  }

  function festejar(texto) {
    if (reduzir) { if (texto) avisar(texto); return; }
    const caixa = document.createElement('div');
    caixa.className = 'festa';
    const qtd = texto ? 70 : 14;
    const cores = ['#f2b13a', '#ffc85c', '#2f9a6a', '#3f78d8', '#9a55d6', '#ff9784'];
    for (let i = 0; i < qtd; i++) {
      const c = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, dist = (texto ? 220 : 90) + Math.random() * (texto ? 320 : 80);
      c.style.background = cores[i % cores.length];
      c.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      c.style.setProperty('--y', Math.sin(ang) * dist + (texto ? 120 : 40) + 'px');
      c.style.setProperty('--r', Math.random() * 720 + 'deg');
      if (!texto) { const r = document.activeElement.getBoundingClientRect(); c.style.left = r.left + r.width / 2 + 'px'; c.style.top = r.top + r.height / 2 + 'px'; }
      caixa.appendChild(c);
    }
    document.body.appendChild(caixa);
    setTimeout(() => caixa.remove(), 1400);
    if (texto) avisar(texto);
  }
  function avisar(texto) {
    const a = document.createElement('div');
    a.className = 'aviso-festa';
    a.textContent = texto;
    document.body.appendChild(a);
    setTimeout(() => a.remove(), 2600);
  }

  function inicioExtra(conteudo) {
    const prox = paginas.find((p) => p.num && !feitas[p.id]);
    const grade = document.createElement('div');
    grade.className = 'missoes';
    grade.innerHTML = paginas.filter((p) => p.num).map((p) => {
      const cls = ['cartao', feitas[p.id] ? 'jogada' : '', prox && prox.id === p.id ? 'prox' : ''].join(' ');
      const atoNome = ['', 'Ato I', 'Ato II', 'Ato III'][atoDe(p)];
      return `<button type="button" class="${cls}" style="--c:${CORES[atoDe(p)]}" data-ir="${p.id}"><span class="num">${p.num}</span><span class="ato">${atoNome}</span><span class="nome">${esc(p.curto.replace(/^\d+\.\s*/, ''))}</span><span class="nivel"><span>Nível ${nivelDe(p)}</span>${prox && prox.id === p.id ? '<span class="prox-selo">PRÓXIMA</span>' : ''}</span></button>`;
    }).join('');
    grade.addEventListener('click', (ev) => { const b = ev.target.closest('[data-ir]'); if (b) location.hash = b.dataset.ir; });
    const titulo = document.createElement('h2');
    titulo.textContent = 'As 13 missões';
    titulo.style.marginTop = '0';
    conteudo.prepend(grade);
    conteudo.prepend(titulo);
  }

  const LEGENDA = `<div class="legenda"><span><i style="background:var(--ler)"></i>Ler em voz alta</span><span><i style="background:var(--fala)"></i>Fala de personagem</span><span><i style="background:var(--mestre)"></i>Para o mestre</span><span><i style="background:var(--ouro-forte)"></i>Sua mesa</span><button type="button" class="btn-narrar" id="btn-narrar" aria-pressed="false">🎙 Modo narração</button></div>`;
  let narrando = ler('cronicas-narrar', false);

  // Marca como fala todo trecho entre aspas que parece dito por alguém (frase com pontuação ou 4+ palavras).
  function marcarFalas(raiz) {
    const andar = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement.closest('pre, code, script, .selo, .mesa-selo, .selo-mestre, q.fala, h1, h2') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nos = [];
    while (andar.nextNode()) nos.push(andar.currentNode);
    const re = /["“]([^"”]{2,}?)["”]/g;
    for (const n of nos) {
      const t = n.nodeValue;
      if (!/["“]/.test(t)) continue;
      let m, ultimo = 0, achou = false;
      const frag = document.createDocumentFragment();
      re.lastIndex = 0;
      while ((m = re.exec(t))) {
        const dentro = m[1].trim();
        const fala = (/[.!?…,]$/.test(dentro) || dentro.split(/\s+/).length >= 4) && !ehTitulo(semAcento(dentro));
        if (!fala) continue;
        achou = true;
        frag.appendChild(document.createTextNode(t.slice(ultimo, m.index)));
        const q = document.createElement('q');
        q.className = 'fala';
        q.textContent = dentro;
        frag.appendChild(q);
        ultimo = m.index + m[0].length;
      }
      if (!achou) continue;
      frag.appendChild(document.createTextNode(t.slice(ultimo)));
      n.parentNode.replaceChild(frag, n);
    }
    // falas em itálico nas tabelas da bíblia
    raiz.querySelectorAll('.tabela td em').forEach((e) => e.classList.add('fala'));
  }

  let observador = null;
  function mostrar(id) {
    const p = paginas.find((x) => x.id === id) || paginas[0];
    document.body.dataset.ato = String(atoDe(p));
    montarMenu(p.id);
    const total = p.num ? contarCenas(p) : 0;
    const chips = p.num ? `<div class="chips"><span class="chip">Nível ${nivelDe(p)}</span><span class="chip">${total} cenas</span><label class="chip"><input type="checkbox" id="feita-${p.id}"${feitas[p.id] ? ' checked' : ''}> Já jogamos</label></div>
      <div class="barra-missao"><div class="trilho"><i></i></div><span></span></div>` : '';
    const numero = p.num ? `<div class="numero">${p.num}</div>` : '';
    leitura.innerHTML = `<header class="capa">${numero}<p class="grupo">${esc(p.grupo)}</p><h1>${esc(p.num ? p.titulo.replace(/^Missão \d+ — /, '') : p.titulo)}</h1>${chips}</header>
      ${p.num ? '<div class="pulos" id="pulos"></div>' : ''}<article class="folha">${p.num ? LEGENDA : ''}<div class="conteudo">${p.html}</div></article>`;
    const conteudo = leitura.querySelector('.conteudo');
    marcarFalas(conteudo);
    const bn = $('btn-narrar');
    document.body.classList.toggle('narrar', !!(narrando && p.num));
    if (bn) {
      bn.setAttribute('aria-pressed', String(!!narrando));
      bn.addEventListener('click', () => { narrando = !narrando; guardar('cronicas-narrar', narrando); bn.setAttribute('aria-pressed', String(narrando)); document.body.classList.toggle('narrar', narrando); });
    }
    const caixa = $('feita-' + p.id);
    if (caixa) caixa.addEventListener('change', () => { feitas[p.id] = caixa.checked; guardar('cronicas-feitas', feitas); montarMenu(p.id); if (caixa.checked) festejar(null); });
    if (p.id === 'inicio') inicioExtra(conteudo);
    let alvos = [];
    if (p.num) {
      alvos = emCenas(conteudo, p);
      const curto = (t) => t.replace(/^(Cena \d+)\s*—\s*.*$/, '$1').replace(/^Prólogo\s*—.*$/, 'Prólogo').slice(0, 28);
      $('pulos').innerHTML = alvos.map((s) => `<button type="button" data-ir="${s.id}">${esc(curto(s.querySelector('h2').textContent))}</button>`).join('');
      $('pulos').addEventListener('click', (ev) => { const b = ev.target.closest('[data-ir]'); if (b) $(b.dataset.ir).scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' }); });
    } else {
      alvos = [...conteudo.querySelectorAll('h2[id]')];
    }
    lado.innerHTML = alvos.length > 1 ? '<h2>Nesta página</h2>' + alvos.map((s) => {
      const h = s.tagName === 'H2' ? s : s.querySelector('h2');
      return `<a href="#${p.id}" data-ir="${s.id}">${esc(h.textContent)}</a>`;
    }).join('') : '';
    if (p.num) atualizarProgresso(p);
    if (p.id === 'resumo') prepararOuvir();
    // destaca a cena que está na tela
    if (observador) observador.disconnect();
    if ('IntersectionObserver' in window && alvos.length) {
      observador = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => {
          if (!e.isIntersecting) return;
          const idv = e.target.id;
          lado.querySelectorAll('a[data-ir]').forEach((a) => a.classList.toggle('aqui', a.dataset.ir === idv));
          const pulos = $('pulos');
          if (pulos) pulos.querySelectorAll('button').forEach((b) => { const sim = b.dataset.ir === idv; b.classList.toggle('aqui', sim); if (sim) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
        });
      }, { rootMargin: '-35% 0px -55% 0px' });
      alvos.forEach((s) => observador.observe(s));
    }
    document.body.classList.remove('menu-aberto');
    $('btn-menu').setAttribute('aria-expanded', 'false');
    window.scrollTo(0, 0);
  }

  lado.addEventListener('click', (ev) => {
    const a = ev.target.closest('a[data-ir]');
    if (!a) return;
    ev.preventDefault();
    const el = $(a.dataset.ir);
    if (el) el.scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' });
  });
  $('btn-menu').addEventListener('click', () => {
    const aberto = document.body.classList.toggle('menu-aberto');
    $('btn-menu').setAttribute('aria-expanded', String(aberto));
  });
  menu.addEventListener('click', (ev) => {
    const a = ev.target.closest('a');
    if (a && a.getAttribute('href') === location.hash) mostrar(location.hash.slice(1));
  });

  // barra de leitura
  window.addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    $('progresso').style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
  }, { passive: true });

  // ---------- busca ----------
  let indice = [];
  const TITULOS = new Set();
  const ehTitulo = (x) => { for (const t of TITULOS) if (t === x || t.startsWith(x + ':') || t.startsWith(x + ' —')) return true; return false; };
  function montarIndice() {
    const tmp = document.createElement('div');
    indice = [];
    for (const p of paginas) {
      tmp.innerHTML = p.html;
      tmp.querySelectorAll('h2, h3, h4, p, li, td').forEach((el) => {
        if (el.closest('li') && el.tagName !== 'LI') return;
        const t = el.textContent.replace(/\s+/g, ' ').trim();
        if (t) indice.push({ pagina: p, texto: t, tag: el.tagName });
        if (t && /^H[2-4]$/.test(el.tagName)) TITULOS.add(semAcento(t));
      });
    }
  }
  const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let achados = [];
  busca.addEventListener('input', () => {
    const q = semAcento(busca.value.trim());
    if (q.length < 3) { resultados.hidden = true; return; }
    achados = indice.filter((x) => semAcento(x.texto).includes(q)).slice(0, 40);
    if (!achados.length) { resultados.innerHTML = '<div class="vazio">Nada encontrado.</div>'; resultados.hidden = false; return; }
    resultados.innerHTML = achados.map((x, i) => {
      const n = semAcento(x.texto).indexOf(q);
      const ini = Math.max(0, n - 50);
      const trecho = (ini ? '…' : '') + esc(x.texto.slice(ini, n)) + '<b>' + esc(x.texto.slice(n, n + q.length)) + '</b>' + esc(x.texto.slice(n + q.length, n + q.length + 80)) + '…';
      return `<button type="button" data-i="${i}"><span class="onde">${esc(x.pagina.curto)}</span>${trecho}</button>`;
    }).join('');
    resultados.hidden = false;
  });
  resultados.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-i]');
    if (!b) return;
    const x = achados[Number(b.dataset.i)];
    resultados.hidden = true;
    busca.value = '';
    if (location.hash !== '#' + x.pagina.id) history.replaceState(null, '', '#' + x.pagina.id);
    mostrar(x.pagina.id);
    const el = [...leitura.querySelectorAll('.conteudo ' + x.tag.toLowerCase())].find((e) => e.textContent.replace(/\s+/g, ' ').trim() === x.texto);
    if (el) { el.scrollIntoView({ block: 'center' }); el.style.transition = 'background .6s'; el.style.background = 'var(--ouro-fundo)'; setTimeout(() => { el.style.background = ''; }, 1800); }
  });
  document.addEventListener('click', (ev) => { if (!ev.target.closest('.busca')) resultados.hidden = true; });
  busca.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { resultados.hidden = true; busca.blur(); } });

  // ---------- ouvir o resumo ----------
  function prepararOuvir() {
    const fala = window.speechSynthesis;
    const info = $('voz-info');
    const pars = [...leitura.querySelectorAll('.falado')];
    if (!fala) { info.textContent = 'Este navegador não lê em voz alta.'; return; }
    let ativo = false, atual = 0;
    const nota = (v) => { const n = v.name.toLowerCase(); return (/pt-br/i.test(v.lang) ? 100 : 0) + (/natural|online|neural/.test(n) ? 30 : 0) + (/google/.test(n) ? 20 : 0); };
    const voz = () => fala.getVoices().filter((v) => /^pt/i.test(v.lang)).sort((a, b) => nota(b) - nota(a))[0];
    const marcar = (i) => { pars.forEach((p, k) => p.classList.toggle('lendo', k === i)); if (pars[i]) pars[i].scrollIntoView({ block: 'center', behavior: reduzir ? 'auto' : 'smooth' }); };
    function seguinte() {
      if (!ativo || atual >= pars.length) { ativo = false; marcar(-1); return; }
      marcar(atual);
      const frases = pars[atual].textContent.match(/[^.!?:]+[.!?:]*/g) || [pars[atual].textContent];
      let k = 0;
      const dizer = () => {
        if (!ativo) return;
        if (k >= frases.length) { atual += 1; setTimeout(seguinte, 300); return; }
        const u = new SpeechSynthesisUtterance(frases[k++].trim());
        const v = voz();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'pt-BR';
        u.onend = dizer; u.onerror = dizer;
        fala.speak(u);
      };
      dizer();
    }
    $('ouvir-resumo').onclick = () => { fala.cancel(); ativo = true; atual = 0; const v = voz(); info.textContent = v ? `Voz: ${v.name}` : 'Sem voz em português: o navegador usa a padrão.'; seguinte(); };
    $('parar-resumo').onclick = () => { ativo = false; fala.cancel(); marcar(-1); };
    pars.forEach((p, i) => { p.style.cursor = 'pointer'; p.onclick = () => { fala.cancel(); ativo = true; atual = i; seguinte(); }; });
  }

  const rota = () => mostrar(location.hash.slice(1) || 'inicio');
  window.addEventListener('hashchange', rota);
  fetch('dados/cronicas.json')
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((dados) => { paginas = dados; montarIndice(); rota(); })
    .catch(() => { leitura.innerHTML = '<p>Não consegui carregar o conteúdo. Recarregue a página.</p>'; });
})();
</script>
